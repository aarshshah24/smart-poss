<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="icon" type="image/png" href="src/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #212529;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-container {
            max-width: 400px;
            width: 100%;
            padding: 30px;
            border-radius: 12px;
            background-color: #343a40;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        h3, label {
            color: #fff;
        }

        .form-control {
            background-color: #495057;
            border: none;
            color: #fff;
        }

        .form-control::placeholder {
            color: #ced4da;
        }

        .brand-btn {
            background-color: #ff7733;
            color: #fff;
            border: none;
        }

        .brand-btn:hover {
            background-color: #ff5f1f;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h3 class="text-center mb-4">Outlet Login</h3>

    <form id="loginForm">
        <div class="mb-3">
            <label>Email</label>
            <input id="email" type="email" class="form-control" placeholder="Enter registered email" required>
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input id="password" type="password" class="form-control" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn brand-btn w-100">
            Login
        </button>
        <div id="loginError" style="display:none; color:#ff7733; margin-top:10px; font-weight: 500;"></div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const BASE = "http://localhost:8080/api";

    document.getElementById("loginForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const errorBox = document.getElementById("loginError");

        // Reset error UI
        errorBox.innerText = "";
        errorBox.style.display = "none";

        fetch(BASE + "/outlet/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,
                password: password
            })
        })
            .then(async (res) => {
                // Read JSON body even if the status is an error (401, 403, etc.)
                const data = await res.json();

                // Check if login was unsuccessful
                if (!res.ok || data.success === false) {
                    // Throwing an error here pushes execution to the .catch() block
                    throw new Error(data.message || "Invalid credentials or account not approved.");
                }

                return data;
            })
            .then(data => {
                // Success: Save outlet data and redirect
                localStorage.setItem("outlet", JSON.stringify(data.data));
                window.location.href = "outlet-dashboard.html";
            })
            .catch(err => {
                // Catch-all for thrown errors and network failures
                errorBox.innerText = err.message;
                errorBox.style.display = "block";
            });
    });
</script>
</body>
</html>
