<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Outlet Dashboard | SMART POSS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="src/favicon.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="outlet-dashboard.css">
</head>
<body>

<nav class="navbar outlet-navbar px-3">
    <button class="btn d-md-none text-white" data-bs-toggle="offcanvas" data-bs-target="#outletSidebar">☰</button>
    <span class="navbar-brand fw-bold ms-2 outlet-title" id="outletName">Loading...</span>
    <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
</nav>

<div class="offcanvas offcanvas-start text-bg-dark" id="outletSidebar">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title">SMART POSS</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
        <ul class="nav flex-column">
            <li><a class="nav-link active" href="#" onclick="showSection('dashboard')"><i class="bi bi-grid"></i> Dashboard</a></li>
            <li><a class="nav-link" href="#" onclick="showSection('menu')"><i class="bi bi-list-ul"></i> Menu</a></li>
        </ul>
    </div>
</div>

<div class="container-fluid">
    <div class="row">

        <aside class="col-md-2 outlet-sidebar d-none d-md-block p-0">
            <ul class="nav flex-column mt-4">
                <li><a class="nav-link active" href="#" onclick="showSection('dashboard')"><i class="bi bi-grid"></i> Dashboard</a></li>
                <li><a class="nav-link" href="#" onclick="showSection('menu')"><i class="bi bi-list-ul"></i> Menu</a></li>
            </ul>
        </aside>

        <main class="col-md-10 outlet-main">

            <div id="dashboardSection">
                <div class="row g-3 mb-4">
                    <div class="col-6 col-md-3"><div class="stat-box"><h6>Today Orders</h6><h2>0</h2></div></div>
                    <div class="col-6 col-md-3"><div class="stat-box"><h6>Revenue</h6><h2>₹0</h2></div></div>
                    <div class="col-6 col-md-3"><div class="stat-box"><h6>Pending</h6><h2>0</h2></div></div>
                    <div class="col-6 col-md-3"><div class="stat-box"><h6>Top Item</h6><h2>-</h2></div></div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-12 col-md-4">
                        <div class="action-card">
                            <i class="bi bi-plus-circle"></i>
                            <h5>Add Order</h5>
                        </div>
                    </div>
                    <div class="col-12 col-md-4">
                        <div class="action-card" onclick="showSection('menu')" style="cursor:pointer">
                            <i class="bi bi-pencil-square"></i>
                            <h5>Update Menu</h5>
                        </div>
                    </div>
                    <div class="col-12 col-md-4">
                        <div class="action-card">
                            <i class="bi bi-receipt-cutoff"></i>
                            <h5>Generate Bill</h5>
                        </div>
                    </div>
                </div>

                <div class="card outlet-card">
                    <div class="card-header fw-bold">Recent Orders</div>
                    <div class="card-body table-responsive">
                        <table class="table table-dark table-hover align-middle">
                            <thead>
                            <tr><th>#</th><th>Order</th><th>Amount</th><th>Status</th></tr>
                            </thead>
                            <tbody>
                            <tr><td>1</td><td>#ORD1023</td><td>₹450</td><td><span class="badge bg-success">Completed</span></td></tr>
                            <tr><td>2</td><td>#ORD1024</td><td>₹820</td><td><span class="badge bg-warning">Preparing</span></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div id="menuSection" class="d-none">
                <div class="card outlet-card mb-3">
                    <div class="card-header fw-bold">Add Menu</div>
                    <div class="card-body">
                        <form onsubmit="addMenuItem(event)">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Item Name</label>
                                    <input type="text" id="itemName" class="form-control" placeholder="Enter item name" required oninput="clearError()">

                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Price</label>
                                    <input type="number" id="itemPrice" class="form-control" placeholder="₹ Price" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Category</label>
                                    <select id="itemCategory" class="form-select">
                                        <option>Starter</option>
                                        <option>Main Course</option>
                                        <option>Snacks</option>
                                        <option>Beverage</option>
                                    </select>
                                </div>
                                <div class="col-12 text-end">
                                    <button type="submit" class="btn btn-success px-4">Add Item</button>
                                </div>
                                <small id="menuError" class="mt-1" style="display:flex;color: #ff7733;text-align: center"></small>

                            </div>
                        </form>
                    </div>
                </div>

                <div class="card outlet-card">
                    <div class="card-header fw-bold">Menu Items</div>
                    <div class="card-body table-responsive">
                        <table class="table table-dark table-hover align-middle">
                            <thead>
                            <tr>
                                <th>#</th>
                                <th>Item Name</th>
                                <th>Price</th>
                                <th>Category</th>
                                <th>Actions</th>
                            </tr>
                            </thead>
                            <tbody id="menuList"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const BASE = "http://localhost:8080/api";
    let outlet = JSON.parse(localStorage.getItem("outlet"));

    if(!outlet){
        window.location.href = "auth.html";
    } else {
        document.getElementById("outletName").innerText = outlet.outletName;
    }

    function sendHeartbeat() {
        if (outlet && outlet.id) {
            fetch(`${BASE}/heartbeat/${outlet.id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" }
            })
                .catch(err => console.error("Heartbeat error:", err));
        }
    }

    sendHeartbeat();
    const heartbeatInterval = setInterval(sendHeartbeat, 60000);

    function showSection(section) {
        document.getElementById("dashboardSection").classList.add("d-none");
        document.getElementById("menuSection").classList.add("d-none");

        if (section === "dashboard") {
            document.getElementById("dashboardSection").classList.remove("d-none");
        }

        if (section === "menu") {
            document.getElementById("menuSection").classList.remove("d-none");
            loadMenu();
        }

        const allLinks = document.querySelectorAll('.nav-link');
        allLinks.forEach(link => {
            link.classList.remove('active');
            if (link.innerText.toLowerCase().includes(section)) {
                link.classList.add('active');
            }
        });

        const offcanvasElement = document.getElementById('outletSidebar');
        const instance = bootstrap.Offcanvas.getInstance(offcanvasElement);
        if(instance) instance.hide();
    }

    /* ================================
       MENU MANAGEMENT (CRUD)
    ================================ */
    let editItemId = null;

    function clearError() {
        const errorBox = document.getElementById("menuError");
        errorBox.style.display = "none";
        errorBox.innerText = "";
    }

    function addMenuItem(event){
        event.preventDefault();
        clearError(); // Clear any old error

        let itemName=document.getElementById("itemName").value;
        let price=document.getElementById("itemPrice").value;
        let category=document.getElementById("itemCategory").value;

        const url = editItemId ? `${BASE}/menu/${editItemId}` : `${BASE}/menu/add`;
        const method = editItemId ? "PUT" : "POST";
        const body = editItemId ? { itemName, price, category } : { outletId:outlet.id, itemName, price, category };

        fetch(url, {
            method: method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
        })
            .then(async (res) => {
                const data = await res.json();
                if (!res.ok) {
                    // INJECT LITTLE MESSAGE INSTEAD OF ALERT
                    const errorBox = document.getElementById("menuError");
                    errorBox.innerText = data.message || "Failed to add item";
                    errorBox.style.display = "block";
                    throw new Error(data.message);
                }
                return data;
            })
            .then(() => {
                editItemId = null;
                loadMenu();
                event.target.reset();
            })
            .catch(err => {
                console.error("Error:", err.message);
            });
    }

    function loadMenu(){
        fetch(`${BASE}/menu/${outlet.id}`)
            .then(res=>res.json())
            .then(data=>{
                let table=document.getElementById("menuList");
                table.innerHTML="";
                data.forEach((item,index)=>{
                    table.innerHTML+=`
                        <tr>
                            <td>${index+1}</td>
                            <td>${item.itemName}</td>
                            <td>₹${item.price}</td>
                            <td>${item.category}</td>
                            <td>
                                <button class="btn btn-sm btn-primary me-1" onclick="editItem('${item.id}','${item.itemName}','${item.price}','${item.category}')">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="deleteItem('${item.id}')">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>`;
                });
            });
    }

    function editItem(id,name,price,category){
        editItemId=id;
        document.getElementById("itemName").value=name;
        document.getElementById("itemPrice").value=price;
        document.getElementById("itemCategory").value=category;
        clearError();
    }

    function deleteItem(id){
        if(confirm("Delete this item?")){
            fetch(`${BASE}/menu/${id}`,{ method:"DELETE" })
                .then(()=>loadMenu());
        }
    }

    /* ================================
       LOGOUT & SECURITY
    ================================ */
    function logout(){
        fetch(`${BASE}/logout/${outlet.id}`, { method: "PUT" })
            .then(() => {
                clearInterval(heartbeatInterval);
                localStorage.removeItem("outlet");
                window.location.href = "index.html";
            });
    }

    window.history.forward();
    function noBack(){ window.history.forward(); }
    setTimeout(noBack,0);
</script>
</body>
</html>
