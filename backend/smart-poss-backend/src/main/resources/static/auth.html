<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="src/favicon.png">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #212529;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-container {
            max-width: 400px;
            width: 100%;
            padding: 30px;
            border-radius: 12px;
            background-color: #343a40;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        h3, label {
            color: #fff;
        }

        .form-control {
            background-color: #495057;
            border: none;
            color: #fff;
        }

        .form-control::placeholder {
            color: #ced4da;
        }

        .brand-btn {
            background-color: #ff7733;
            color: #fff;
            border: none;
        }

        .brand-btn:hover {
            background-color: #ff5f1f;
        }

        .btn a {
            text-decoration: none;
            color: #fff;
        }

        .error-message{
            color:#ff6b6b;
            margin-top:10px;
            text-align:center;
        }
    </style>
</head>
<body>

<div class="form-container">

    <h3 class="text-center mb-4">Outlet Login</h3>

    <!-- LOGIN FORM -->
    <form id="loginForm">

        <div class="mb-3">
            <label>Email</label>
            <input id="email" type="email" class="form-control" placeholder="Enter registered email" required>
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input id="password" type="password" class="form-control" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn brand-btn w-100">
            Login
        </button>

        <div id="errorMessage" class="error-message"></div>

    </form>

</div>

<!-- API FILE -->
<script src="api.js"></script>

<script>

    document.getElementById("loginForm").addEventListener("submit", function(e){

        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const loginData = {
            email: email,
            password: password
        };

        postData("/outlets/login", loginData)

            .then(response => {

                // store outlet details
                localStorage.setItem("outletName", response.outletName);
                localStorage.setItem("outletId", response.outletId);

                // redirect to dashboard
                window.location.href = "outlet-dashboard.html";

            })

            .catch(error => {

                document.getElementById("errorMessage").innerText =
                    error.message || "Login failed";

            });

    });

</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
