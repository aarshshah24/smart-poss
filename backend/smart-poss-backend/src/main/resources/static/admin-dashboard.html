<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | SMART POSS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="admin-dashboard.css">
</head>

<body>

<nav class="navbar navbar-dark admin-navbar px-3">
    <span class="navbar-brand fw-bold ms-2">SMART POSS • Admin</span>
</nav>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <aside class="col-md-2 sidebar d-none d-md-block p-0">
            <ul class="nav flex-column mt-4">

                <li><a class="nav-link active" href="#" onclick="showSection('dashboard',this)">Dashboard</a></li>
                <li><a class="nav-link" href="#" onclick="showSection('requests',this)">Outlet Requests</a></li>
                <li><a class="nav-link" href="#">Verified Outlets</a></li>
                <li><a class="nav-link" href="#">Users</a></li>
                <li><a class="nav-link" href="#">Reports</a></li>

            </ul>
        </aside>

        <main class="col-md-10 main-content">

            <!-- STATS -->
            <div class="row g-3 mb-4">
                <div class="col-6 col-md-3"><div class="stat-card"><h6>Total Outlets</h6><h2 id="totalOutlets">0</h2></div></div>
                <div class="col-6 col-md-3"><div class="stat-card"><h6>Pending Requests</h6><h2 id="pendingOutlets">0</h2></div></div>
                <div class="col-6 col-md-3"><div class="stat-card"><h6>Active Users</h6><h2>0</h2></div></div>
                <div class="col-6 col-md-3"><div class="stat-card"><h6>Revenue</h6><h2>₹0</h2></div></div>
            </div>

            <!-- DASHBOARD -->
            <div id="dashboard">

                <div class="card admin-card">
                    <div class="card-header fw-bold">Latest 5 Pending Outlets</div>

                    <div class="card-body table-responsive">
                        <table class="table table-dark table-hover">

                            <thead>
                            <tr>
                                <th>Owner</th>
                                <th>Outlet</th>
                                <th>City</th>
                                <th>Contact</th>
                                <th>Action</th>
                            </tr>
                            </thead>

                            <tbody id="dashboardTable"></tbody>

                        </table>
                    </div>
                </div>

            </div>

            <!-- REQUESTS -->
            <div id="requests" class="d-none">

                <div class="card admin-card mt-4">
                    <div class="card-header fw-bold">All Pending Requests</div>

                    <div class="card-body table-responsive">
                        <table class="table table-dark table-hover">

                            <thead>
                            <tr>
                                <th>#</th>
                                <th>Owner</th>
                                <th>Outlet</th>
                                <th>City</th>
                                <th>Contact</th>
                                <th>Action</th>
                            </tr>
                            </thead>

                            <tbody id="requestsTable"></tbody>

                        </table>
                    </div>
                </div>

            </div>

        </main>
    </div>
</div>

<script src="admin-dashboard.js"></script>

</body>
</html>
