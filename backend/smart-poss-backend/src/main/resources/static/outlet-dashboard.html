<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Outlet Dashboard | SMART POSS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="src/favicon.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="outlet-dashboard.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar outlet-navbar px-3">
    <button class="btn d-md-none text-white" data-bs-toggle="offcanvas" data-bs-target="#outletSidebar">☰</button>
    <span class="navbar-brand fw-bold ms-2 outlet-title">Spice Corner</span>
    <button class="btn btn-outline-light btn-sm">Logout</button>
</nav>

<!-- MOBILE SIDEBAR -->
<div class="offcanvas offcanvas-start text-bg-dark" id="outletSidebar">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title">SMART POSS</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
        <ul class="nav flex-column">
            <li><a class="nav-link" href="#" onclick="showSection('dashboard')"><i class="bi bi-grid"></i> Dashboard</a></li>
            <li><a class="nav-link" href="#" onclick="showSection('menu')"><i class="bi bi-list-ul"></i> Menu</a></li>
        </ul>
    </div>
</div>

<div class="container-fluid">
    <div class="row">

        <!-- DESKTOP SIDEBAR -->
        <aside class="col-md-2 outlet-sidebar d-none d-md-block p-0">
            <ul class="nav flex-column mt-4">
                <li><a class="nav-link active" href="#" onclick="showSection('dashboard')"><i class="bi bi-grid"></i> Dashboard</a></li>
                <li><a class="nav-link" href="#" onclick="showSection('menu')"><i class="bi bi-list-ul"></i> Menu</a></li>
            </ul>
        </aside>

        <!-- MAIN -->
        <main class="col-md-10 outlet-main">

            <!-- DASHBOARD SECTION -->
            <div id="dashboardSection">

                <!-- STATS -->
                <div class="row g-3 mb-4">
                    <div class="col-6 col-md-3"><div class="stat-box"><h6>Today Orders</h6><h2>48</h2></div></div>
                    <div class="col-6 col-md-3"><div class="stat-box"><h6>Revenue</h6><h2>₹12,500</h2></div></div>
                    <div class="col-6 col-md-3"><div class="stat-box"><h6>Pending</h6><h2>5</h2></div></div>
                    <div class="col-6 col-md-3"><div class="stat-box"><h6>Top Item</h6><h2>Paneer</h2></div></div>
                </div>

                <!-- ACTIONS -->
                <div class="row g-3 mb-4">
                    <div class="col-12 col-md-4">
                        <div class="action-card">
                            <i class="bi bi-plus-circle"></i>
                            <h5>Add Order</h5>
                        </div>
                    </div>

                    <div class="col-12 col-md-4">
                        <div class="action-card" onclick="showSection('menu')" style="cursor:pointer">
                            <i class="bi bi-pencil-square"></i>
                            <h5>Update Menu</h5>
                        </div>
                    </div>

                    <div class="col-12 col-md-4">
                        <div class="action-card">
                            <i class="bi bi-receipt-cutoff"></i>
                            <h5>Generate Bill</h5>
                        </div>
                    </div>
                </div>

                <!-- TABLE -->
                <div class="card outlet-card">
                    <div class="card-header fw-bold">Recent Orders</div>
                    <div class="card-body table-responsive">
                        <table class="table table-dark table-hover align-middle">
                            <thead>
                                <tr><th>#</th><th>Order</th><th>Amount</th><th>Status</th></tr>
                            </thead>
                            <tbody>
                                <tr><td>1</td><td>#ORD1023</td><td>₹450</td><td><span class="badge bg-success">Completed</span></td></tr>
                                <tr><td>2</td><td>#ORD1024</td><td>₹820</td><td><span class="badge bg-warning">Preparing</span></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>

            <!-- MENU SECTION -->
            <div id="menuSection" class="d-none">

                <div class="card outlet-card">
                    <div class="card-header fw-bold">Add Menu</div>
                    <div class="card-body">

                        <form>
                            <div class="row g-3">

                                <div class="col-md-6">
                                    <label class="form-label">Item Name</label>
                                    <input type="text" class="form-control" placeholder="Enter item name">
                                </div>

                                <div class="col-md-3">
                                    <label class="form-label">Price</label>
                                    <input type="number" class="form-control" placeholder="₹ Price">
                                </div>

                                <div class="col-md-3">
                                    <label class="form-label">Category</label>
                                    <select class="form-select">
                                        <option>Starter</option>
                                        <option>Main Course</option>
                                        <option>Snacks</option>
                                        <option>Beverage</option>
                                    </select>
                                </div>

                                <div class="col-12 text-end">
                                    <button type="submit" class="btn btn-success px-4">Add Item</button>
                                </div>

                            </div>
                        </form>

                    </div>
                </div>

            </div>

        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
function showSection(section) {

    // Hide all sections
    document.getElementById("dashboardSection").classList.add("d-none");
    document.getElementById("menuSection").classList.add("d-none");

    // Show selected section
    if (section === "dashboard") {
        document.getElementById("dashboardSection").classList.remove("d-none");
    }

    if (section === "menu") {
        document.getElementById("menuSection").classList.remove("d-none");
    }

    // ===== ACTIVE SIDEBAR FIX (DESKTOP + MOBILE) =====
    document.querySelectorAll(".outlet-sidebar .nav-link, .offcanvas .nav-link").forEach(link => {
        link.classList.remove("active");
    });

    document.querySelectorAll(`[onclick="showSection('${section}')"]`).forEach(link => {
        link.classList.add("active");
    });
}
</script>

</body>
</html>
